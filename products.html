<!DOCTYPE html>

<body class="products-page">

  <nav class="site-nav__links shop-head__links" id="site-nav-links" aria-label="主要選單">

  <div class="site-nav__icons">
    <form class="shop-search" action="articles.html" role="search">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="M16 16l4.5 4.5"/></svg>
      <input type="search" name="q" placeholder="搜尋茶品、文章或關鍵字…" aria-label="搜尋" maxlength="50">
    </form>
    <a href="cart.html" class="site-nav__icon shop-head__cart" aria-label="購物車" title="購物車">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 8h14l-1.2 12.1a1 1 0 0 1-1 .9H7.2a1 1 0 0 1-1-.9z"/><path d="M9 10V6.5a3 3 0 0 1 6 0V10"/></svg>

<div class="p-wrap">
  <div class="p-layout">

    <!-- ---------- 左側篩選欄 ---------- -->
    <aside class="p-sidebar">
      <div class="p-side-head">
        <img src="assets/img/leaf-1.png" alt="" class="p-side-head__icon">
        <h2 class="p-side-head__title">篩選</h2>
      </div>

      <div class="p-search">
        <p class="p-label">搜尋茶品名稱</p>
        <input type="search" class="p-search__input" placeholder="輸入關鍵字" aria-label="搜尋茶品名稱" data-filter-keyword>
        <button type="button" class="p-search__btn" aria-label="搜尋" data-filter-search>
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
            <circle cx="11" cy="11" r="7"></circle>
            <line x1="16.5" y1="16.5" x2="21" y2="21"></line>
          </svg>
        </button>
      </div>

      <div class="p-group">
        <p class="p-label">分類</p>
        <label class="p-check"><input type="checkbox" name="category" value="tea_bag"> 茶包</label>
        <label class="p-check"><input type="checkbox" name="category" value="tea_leaf"> 茶葉</label>
        <label class="p-check"><input type="checkbox" name="category" value="teaware"> 茶具</label>
        <label class="p-check"><input type="checkbox" name="category" value="gift_set"> 禮盒</label>
      </div>

      <div class="p-group">
        <p class="p-label">風味</p>
        <label class="p-check"><input type="checkbox" name="flavor" value="rich"> 濃郁 Rich</label>
        <label class="p-check"><input type="checkbox" name="flavor" value="balance"> 均衡 Balance</label>
        <label class="p-check"><input type="checkbox" name="flavor" value="light"> 清爽 Light</label>
      </div>

      <button type="button" class="p-clear" data-filter-clear>清除篩選</button>

      <img src="assets/img/leaf-1.png" alt="" class="p-side-deco">
    </aside>

    <!-- ---------- 右側商品區 ---------- -->
    <section class="p-main">
      <div class="p-main-head">
        <h1 class="p-main-head__title">全部茶品</h1>
        <select class="p-sort" aria-label="排序方式" data-filter-sort>
          <option value="featured">精選推薦</option>
          <option value="price_asc">價格由低至高</option>
          <option value="price_desc">價格由高至低</option>
          <option value="newest">最新上架</option>
        </select>
      </div>

      <div class="p-strength">
        <span class="p-strength__label">風味強度</span>
        <button type="button" class="p-pill p-pill--rich" data-flavor="rich" aria-pressed="false">濃郁</button>
        <button type="button" class="p-pill p-pill--balance" data-flavor="balance" aria-pressed="false">均衡</button>
        <button type="button" class="p-pill p-pill--light" data-flavor="light" aria-pressed="false">清爽</button>
      </div>

      <div class="p-grid" data-product-grid>

        <a class="p-card" href="product.html?slug=honey-black" data-sku="HONEY-BLACK">
          <span class="p-card__tag p-card__tag--rich">濃郁</span>
          <button type="button" class="p-card__wish" aria-label="加入收藏">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
              <path d="M12 20.5 3.8 12.3a5 5 0 1 1 7.1-7.1l1.1 1.1 1.1-1.1a5 5 0 1 1 7.1 7.1z"></path>
            </svg>
          </button>
          <div class="p-card__media">
            <img src="assets/img/product-honey-black.png" alt="蟬吃蜜香紅茶">
          </div>
          <div class="p-card__body">
            <p class="p-card__desc">小綠葉蟬的天然蜜果香</p>
            <h3 class="p-card__name">蟬吃蜜香紅茶</h3>
            <p class="p-card__price">NT$480</p>
            <div class="p-card__actions">
              <span class="p-card__cta">了解更多</span>
              <button type="button" class="p-card__add" data-add-to-cart>加入購物車</button>
            </div>
          </div>
        </a>

        <a class="p-card" href="product.html?slug=gaba" data-sku="GABA">
          <span class="p-card__tag p-card__tag--balance">均衡</span>
          <button type="button" class="p-card__wish" aria-label="加入收藏">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
              <path d="M12 20.5 3.8 12.3a5 5 0 1 1 7.1-7.1l1.1 1.1 1.1-1.1a5 5 0 1 1 7.1 7.1z"></path>
            </svg>
          </button>
          <div class="p-card__media">
            <img src="assets/img/product-gaba.png" alt="蟬吃佳葉龍茶">
          </div>
          <div class="p-card__body">
            <p class="p-card__desc">厭氧發酵・安定心神</p>
            <h3 class="p-card__name">蟬吃佳葉龍茶</h3>
            <p class="p-card__price">NT$520</p>
            <div class="p-card__actions">
              <span class="p-card__cta">了解更多</span>
              <button type="button" class="p-card__add" data-add-to-cart>加入購物車</button>
            </div>
          </div>
        </a>

        <a class="p-card" href="product.html?slug=fresh-oolong" data-sku="FRESH-OOLONG">
          <span class="p-card__tag p-card__tag--light">清爽</span>
          <button type="button" class="p-card__wish" aria-label="加入收藏">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
              <path d="M12 20.5 3.8 12.3a5 5 0 1 1 7.1-7.1l1.1 1.1 1.1-1.1a5 5 0 1 1 7.1 7.1z"></path>
            </svg>
          </button>
          <div class="p-card__media">
            <img src="assets/img/product-fresh-oolong.png" alt="蟬吃鮮翠烏龍茶">
          </div>
          <div class="p-card__body">
            <p class="p-card__desc">輕發酵中烘焙・清香甘潤</p>
            <h3 class="p-card__name">蟬吃鮮翠烏龍茶</h3>
            <p class="p-card__price">NT$450</p>
            <div class="p-card__actions">
              <span class="p-card__cta">了解更多</span>
              <button type="button" class="p-card__add" data-add-to-cart>加入購物車</button>
            </div>
          </div>
        </a>

        <a class="p-card" href="product.html?slug=yushan-oolong" data-sku="YUSHAN-OOLONG">
          <span class="p-card__tag p-card__tag--rich">濃郁</span>
          <button type="button" class="p-card__wish" aria-label="加入收藏">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
              <path d="M12 20.5 3.8 12.3a5 5 0 1 1 7.1-7.1l1.1 1.1 1.1-1.1a5 5 0 1 1 7.1 7.1z"></path>
            </svg>
          </button>
          <div class="p-card__media">
            <img src="assets/img/product-yushan-oolong.png" alt="蟬吃玉山烏龍茶">
          </div>
          <div class="p-card__body">
            <p class="p-card__desc">高山雲霧・葉厚耐泡</p>
            <h3 class="p-card__name">蟬吃玉山烏龍茶</h3>
            <p class="p-card__price">NT$680</p>
            <div class="p-card__actions">
              <span class="p-card__cta">了解更多</span>
              <button type="button" class="p-card__add" data-add-to-cart>加入購物車</button>
            </div>
          </div>
        </a>

      </div>

      <div class="p-empty" data-product-empty hidden>
        <p>找不到符合條件的茶品</p>
        <button type="button" class="p-clear" data-filter-clear>清除篩選</button>
      </div>
    </section>

  </div>
</div>

<div class="p-cta-banner">
  <img src="assets/img/cta-banner.png" alt="蟬・蟬・禪・濃　好茶・好生活">
</div>
