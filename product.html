<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>茶品介紹 | 蟬吃茶 ZenEaTea</title>
<link rel="stylesheet" href="css/style.css?v=84c3442b">
<link rel="stylesheet" href="css/products.css?v=dc02391a">
<link rel="stylesheet" href="css/cart.css?v=8e9b63c2">
<link rel="stylesheet" href="css/product.css?v=3a55002c">
<link rel="stylesheet" href="css/site-nav.css?v=c312661f">
<link rel="stylesheet" href="css/shop.css?v=df7b1d7f">
</head>
<body class="products-page product-page">

<header class="site-nav shop-head" data-site-nav data-variant="solid">
  <a href="index.html" class="site-nav__logo shop-head__logo" aria-label="蟬吃茶 首頁"><span class="shop-logo"><span class="shop-logo__name">蟬吃茶<img src="assets/img/seal.png" alt="" class="shop-logo__seal"></span><span class="shop-logo__en">CHAN CHIH CHA</span></span></a>
  <nav class="site-nav__links shop-head__links" id="site-nav-links" aria-label="主要選單">
    <a href="index.html#session-4">關於我們</a>
    <a href="products.html" class="is-active">蟬茶鋪</a>
    <a href="journal.html">蟬茶誌</a>
    <a href="knowledge.html">茶知識</a>
    <a href="experience.html">蟬茗齋</a>
  </nav>
  <div class="site-nav__icons">
    <form class="shop-search" action="articles.html" role="search">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="M16 16l4.5 4.5"/></svg>
      <input type="search" name="q" placeholder="搜尋茶品、文章或關鍵字…" aria-label="搜尋" maxlength="50">
    </form>
    <a href="cart.html" class="site-nav__icon shop-head__cart" aria-label="購物車" title="購物車">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 8h14l-1.2 12.1a1 1 0 0 1-1 .9H7.2a1 1 0 0 1-1-.9z"/><path d="M9 10V6.5a3 3 0 0 1 6 0V10"/></svg>
      <span class="site-nav__count" data-cart-count hidden>0</span>
    </a>
    <button type="button" class="site-nav__icon site-nav__menu-btn" data-nav-toggle aria-label="選單" aria-controls="site-nav-links" aria-expanded="false">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
    </button>
  </div>
</header>

<div class="c-wrap">
  <a href="products.html" class="c-head__back product-back">← 全部茶品</a>

  <p class="c-status" data-product-status>載入中…</p>

  <article class="pd" data-product hidden>
    <div class="pd__media">
      <img data-field="image" alt="">
    </div>

    <div class="pd__info">
      <div class="pd__tags">
        <span class="p-card__tag pd__tag" data-field="flavor" hidden></span>
        <span class="pd__category" data-field="category" hidden></span>
      </div>
      <h1 class="pd__name" data-field="name"></h1>
      <p class="pd__summary" data-field="summary"></p>
      <p class="pd__price" data-field="price"></p>

      <div class="pd__field" data-variant-field>
        <p class="p-label">規格</p>
        <div class="pd__variants" data-variants role="radiogroup" aria-label="規格"></div>
      </div>

      <div class="pd__field">
        <p class="p-label">數量</p>
        <div class="c-qty">
          <button type="button" class="c-qty__btn" data-step="-1" aria-label="減少數量">−</button>
          <input type="number" class="c-qty__input" value="1" min="1" max="99" inputmode="numeric" aria-label="數量" data-qty>
          <button type="button" class="c-qty__btn" data-step="1" aria-label="增加數量">+</button>
        </div>
      </div>

      <div class="pd__actions">
        <button type="button" class="c-checkout pd__add" data-add>加入購物車</button>
        <a href="cart.html" class="pd__to-cart">查看購物車</a>
      </div>

      <section class="pd__notes" data-notes hidden>
        <h2 class="pd__section-title">風味筆記</h2>
        <dl class="pd__notes-list" data-notes-list></dl>
      </section>

      <section class="pd__desc" data-desc-section hidden>
        <h2 class="pd__section-title">關於這款茶</h2>
        <div class="pd__desc-body" data-field="description"></div>
      </section>
    </div>
  </article>

  <div class="c-empty" data-product-missing hidden>
    <img src="assets/img/leaf-1.png" alt="" class="c-empty__icon">
    <p>找不到這款茶，可能已經下架了</p>
    <a href="products.html" class="p-card__cta c-empty__cta">看看其他茶品</a>
  </div>
</div>

<script src="js/cart.js?v=63202081"></script>
<script src="js/product-page.js?v=900281a9"></script>
<script src="js/site-nav.js?v=fbe69245"></script>
</body>
</html>
