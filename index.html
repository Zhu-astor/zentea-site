<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>蟬吃茶 ZenEaTea</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<section class="scroll-session" id="session-1">
  <div class="session-text" data-drift="left">
    <p class="eyebrow">CHAN CHA TEA</p>
    <h1>好茶，<br>是生活裡的一口清晨。</h1>
    <p class="lede">在忙碌裡，為自己留一段慢下來的時光。</p>
  </div>

  <img class="session-leaf" src="assets/img/leaf-1.png" alt="" data-drift="left">
  <img class="session-asset" src="assets/img/landscape-1.png" alt="蟬吃茶 山水意象" data-drift="right" data-base-transform="translateY(-50%)">
</section>

<section class="scroll-session" id="session-2">
  <div class="session-text session-text--right" data-drift="left">
    <p class="eyebrow">CHAN CHA TEA</p>
    <h1>一口茶湯，<br>是與自己的對話。</h1>
    <p class="lede">靜靜喝一口茶，讓時間慢下來，<br>聽見內心最真實的聲音。</p>
  </div>

  <img class="session-asset session-asset--left" src="assets/img/tea-figure-1.png" alt="蟬吃茶 品茶意象" data-drift="right" data-base-transform="translateY(-50%)">
</section>

<!-- 第三段：文字左、素材右，不做左右飄移，只隨捲動淡入淡出 -->
<section class="scroll-session" id="session-3" data-enter-at="0.55">
  <div class="session-text" data-drift="none">
    <p class="eyebrow">CHAN CHA TEA</p>
    <h1>一片葉子，<br>從山林開始。</h1>
    <p class="lede">好茶來自純淨土地，<br>日曬雨露、雲霧滋養，<br>自然孕育一抹清香。</p>
  </div>

  <img class="session-asset session-asset--fade" src="assets/img/landscape-2.png" alt="蟬吃茶 山林意象" data-drift="none" data-base-transform="translateY(-50%)">
</section>

<!-- 第四段：品牌理念，四項依序逐一浮現 -->
<section class="scroll-session" id="session-4" data-enter-at="0.6" data-stagger-count="4">
  <h2 class="ideas-title" data-drift="none" data-stagger="0">品牌理念</h2>

  <div class="ideas">
    <figure class="idea" data-drift="none" data-stagger="0">
      <img class="idea__icon" src="assets/img/idea-chan-crave.png" alt="饞吃茶">
      <figcaption class="idea__text">
        <h3 class="idea__name">饞吃茶</h3>
        <p>好茶！<br>喝一口就令人愛上了</p>
      </figcaption>
    </figure>

    <figure class="idea" data-drift="none" data-stagger="1">
      <img class="idea__icon" src="assets/img/idea-chan-cicada.png" alt="蟬吃茶">
      <figcaption class="idea__text">
        <h3 class="idea__name">蟬吃茶</h3>
        <p>蟬吃系列<br>友善生物、大地及自己<br>一杯蟬吃過的好茶<br>純樸、自然、健康</p>
      </figcaption>
    </figure>

    <figure class="idea" data-drift="none" data-stagger="2">
      <img class="idea__icon" src="assets/img/idea-chan-zen.png" alt="禪吃茶">
      <figcaption class="idea__text">
        <h3 class="idea__name">禪吃茶</h3>
        <p>喝上一杯蟬吃好茶<br>寧靜、專注的感受當下</p>
      </figcaption>
    </figure>

    <figure class="idea" data-drift="none" data-stagger="3">
      <img class="idea__icon" src="assets/img/idea-chan-stream.png" alt="潺吃茶">
      <figcaption class="idea__text">
        <h3 class="idea__name">潺吃茶</h3>
        <p>好喝、自然健康、心靈寧靜<br>進一步有能量，善予他人<br>成為轉動世界正向能量的因子<br>如潺潺流水般，涓涓不息！</p>
      </figcaption>
    </figure>
  </div>
</section>

<!-- 之後的段落接續往下寫，這裡先留著當佔位，讓第四頁滾動時有內容可以滾出去 -->
<section class="scroll-session placeholder-session">
  <div class="placeholder-note">下一段接續製作中</div>
</section>

<script src="js/main.js"></script>
</body>
</html>
